name: Bauen und testen

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux (App und Plasma-Widget)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Übersetzungen und Logik prüfen
        run: |
          node werkzeuge/texte.mjs --streng
          node werkzeuge/baue-uebersetzungen.mjs
          git diff --exit-code -- linux/gemeinsam/uebersetzung.js || { echo "uebersetzung.js ist nicht aktuell – node werkzeuge/baue-uebersetzungen.mjs"; exit 1; }
          node linux/test/logik-test.mjs
          sh -n linux/installieren.sh
      - name: Paket bauen
        run: |
          VERSION=$(cat apple/VERSION)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF#refs/tags/v}"; fi
          sed -i "s/\"Version\": \"[0-9.]*\"/\"Version\": \"$VERSION\"/" linux/plasmoid/package/metadata.json
          sed -i "s/text: \"[0-9.]*\" }/text: \"$VERSION\" }/" linux/app/EinstellungenSeite.qml
          mkdir -p dateien
          tar czf "dateien/paketbote-linux-$VERSION.tar.gz" --exclude=test --exclude=flatpak --transform 's,^linux,paketbote,' linux
          tar tzf "dateien/paketbote-linux-$VERSION.tar.gz" | head -30
      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: dateien

  flatpak:
    name: Linux (Flatpak)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.9
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Paketbote.flatpak
          manifest-path: linux/flatpak/de.teyro.Paketbote.yml
          cache-key: flatpak-${{ github.sha }}
          upload-artifact: false
      - uses: actions/upload-artifact@v5
        with:
          name: flatpak
          path: Paketbote.flatpak

  apple:
    name: iPhone und Mac
    runs-on: macos-26
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@v5

      - name: Übersetzungen vollständig?
        run: node ../werkzeuge/texte.mjs --streng && node ../werkzeuge/baue-uebersetzungen.mjs

      - name: Kern testen
        run: swift test

      - name: Apps bauen
        run: |
          VERSION=$(cat VERSION)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF#refs/tags/v}"; fi
          ./scripts/baue.sh "$VERSION"

      - name: Bildschirmfotos Mac
        timeout-minutes: 8
        run: |
          node ../test/ha-mock.mjs 8123 > /dev/null 2>&1 &
          sleep 2
          mkdir -p bilder-ci/mac
          for m in Light Dark; do
            if [ "$m" = Dark ]; then osascript -e 'tell app "System Events" to tell appearance preferences to set dark mode to true' || true; fi
            for a in liste detail hinzufuegen widgets; do
              PB_ADRESSE=http://127.0.0.1:8123 PB_TOKEN=test-token PB_ANSICHT=$a build/Paketbote.app/Contents/MacOS/Paketbote --vorschau > "bilder-ci/mac/$m-$a.log" 2>&1 &
              PID=$!
              sleep 7
              screencapture -x "bilder-ci/mac/${m}_$a.png" || true
              kill $PID || true
              sleep 1
            done
          done
          cat bilder-ci/mac/*.log | grep -E "vorschau|error" | head -20 || true

      - name: Bildschirmfotos iPhone (Simulator)
        timeout-minutes: 20
        run: |
          xcodebuild -project Paketbote.xcodeproj -scheme Paketbote-iOS -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          APP=build/sim/Build/Products/Debug-iphonesimulator/Paketbote.app
          test -d "$APP"
          GERAET=$(xcrun simctl list devices available -j | node -e 'const d=JSON.parse(require("fs").readFileSync(0)).devices;const l=Object.entries(d).filter(([k])=>k.includes("iOS")).flatMap(([,v])=>v).filter(x=>/^iPhone \d+( Pro)?$/.test(x.name));console.log((l.find(x=>/Pro$/.test(x.name))||l[0]).udid)')
          echo "Gerät: $GERAET"
          xcrun simctl boot "$GERAET"
          xcrun simctl bootstatus "$GERAET" -b
          xcrun simctl install "$GERAET" "$APP"
          mkdir -p bilder-ci/iphone
          for m in light dark; do
            xcrun simctl ui "$GERAET" appearance $m
            for a in liste detail hinzufuegen widgets einstellungen; do
              SIMCTL_CHILD_PB_ADRESSE=http://127.0.0.1:8123 SIMCTL_CHILD_PB_TOKEN=test-token SIMCTL_CHILD_PB_ANSICHT=$a \
                xcrun simctl launch --terminate-running-process "$GERAET" de.teyro.paketbote --vorschau
              sleep 8
              xcrun simctl io "$GERAET" screenshot "bilder-ci/iphone/${m}_$a.png"
            done
          done
          xcrun simctl terminate "$GERAET" de.teyro.paketbote || true

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: bilder
          path: apple/bilder-ci

      - uses: actions/upload-artifact@v5
        with:
          name: apps
          path: |
            apple/build/Paketbote-macOS-*.zip
            apple/build/Paketbote-iOS-*.ipa

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [apple, linux, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: apps
          path: dateien
      - uses: actions/download-artifact@v5
        with:
          name: linux
          path: dateien
      - uses: actions/download-artifact@v5
        with:
          name: flatpak
          path: flatpak
      - run: mv flatpak/Paketbote.flatpak "dateien/Paketbote-${GITHUB_REF_NAME#v}.flatpak"
      - name: Dateien an das Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dateien
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "Siehe Beschreibung."
          gh release upload "$GITHUB_REF_NAME" dateien/* --clobber -R "$GITHUB_REPOSITORY"
